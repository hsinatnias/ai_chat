<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>RAG Chat (EN/JA)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px; background: #f6f7fb; }
    .wrap { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; font-size: 20px; }
    .row { display: flex; gap: 8px; align-items: center; }
    textarea { width: 100%; height: 80px; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #ddd; }
    button { padding: 10px 14px; border-radius: 8px; border: 0; background: #111827; color: white; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .out { margin-top: 16px; white-space: pre-wrap; }
    .cite { font-size: 12px; color: #374151; margin-top: 12px; }
    .cite ul { margin: 4px 0 0 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>RAG Chat (English / 日本語)</h1>
    <div class="row">
      <select id="lang">
        <option value="">Auto</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
      <button id="run">Ask</button>
    </div>
    <textarea id="q" placeholder="Ask a question… (英語でも日本語でもOK)"></textarea>
    <div class="out" id="out"></div>
    <div class="cite" id="cite"></div>
  </div>

<script>
const API = "/chat";
const q = document.getElementById('q');
const run = document.getElementById('run');
const out = document.getElementById('out');
const cite = document.getElementById('cite');
const langSel = document.getElementById('lang');

// dev: prompt for API key once, store in sessionStorage
function getDevKey() {
  //const key = sessionStorage.getItem("dev_api_key");
  const key = 'Af8DEeYg3QsbTszC1RUXcbEZ1DxJ48VbdDpmem4wbFg';
  console.log(key);
  if (key) return key;
  const entered = prompt("Enter your X-API-Key for local testing (will be saved to sessionStorage):");
  if (entered) sessionStorage.setItem("dev_api_key", entered.trim());
  return entered ? entered.trim() : null;
}

run.onclick = async () => {
  const text = q.value.trim();
  if (!text) return;
  const apiKey = getDevKey();
  if (!apiKey) {
    alert("No API key set. Reload and enter a key.");
    return;
  }

  run.disabled = true; out.textContent = "Thinking…"; cite.innerHTML = "";
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "X-API-Key": apiKey
      },
      body: JSON.stringify({ text, lang: langSel.value || null })
    });

    // handle non-2xx responses gracefully
    if (!res.ok) {
      const err = await res.text();
      out.textContent = "Error " + res.status + ": " + err;
      return;
    }

    const data = await res.json();
    out.textContent = data.answer || "(no answer)";
    if (data.citations && data.citations.length) {
      const items = data.citations.map(c => {
        const url = c.meta && c.meta.url ? c.meta.url : (c.meta && c.meta.source_path ? c.meta.source_path : "");
        const label = c.title || url || "Source";
        return `<li>[${c.n}] ${label}${url ? ` — <code>${url}</code>` : ""}</li>`;
      }).join("");
      cite.innerHTML = `<strong>Sources</strong><ul>${items}</ul>`;
    }
  } catch (e) {
    out.textContent = "Error: " + e;
  } finally {
    run.disabled = false;
  }
};
</script>

</body>
</html>
