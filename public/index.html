<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>RAG Chat (EN/JA)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px; background: #f6f7fb; }
    .wrap { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; font-size: 20px; }
    .row { display: flex; gap: 8px; align-items: center; }
    textarea { width: 100%; height: 80px; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #ddd; }
    button { padding: 10px 14px; border-radius: 8px; border: 0; background: #111827; color: white; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .out { margin-top: 16px; white-space: pre-wrap; }
    .cite { font-size: 12px; color: #374151; margin-top: 12px; }
    .cite ul { margin: 4px 0 0 16px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .user { font-size:13px; color:#374151; }
    .logout { background:#e11d48; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>RAG Chat (English / 日本語)</h1>
      <div>
        <span id="who" class="user">Checking...</span>
        <button id="logout" class="logout" style="margin-left:8px;padding:8px 10px;border-radius:8px;border:0;color:white;cursor:pointer">Logout</button>
      </div>
    </div>

    <div class="row" style="margin-bottom:8px">
      <select id="lang">
        <option value="">Auto</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
      <button id="run">Ask</button>
    </div>

    <textarea id="q" placeholder="Ask a question… (英語でも日本語でもOK)"></textarea>
    <div class="out" id="out"></div>
    <div class="cite" id="cite"></div>
  </div>

<script>
/*
  Updated client script (cookie-based auth)
  - Uses /api/auth/whoami to check login
  - Posts to /api/chat (no X-API-Key header)
  - Adds Logout
*/

const API_CHAT = "/api/chat";
const API_WHOAMI = "/api/auth/whoami";
const API_LOGOUT = "/api/auth/logout";

const q = document.getElementById('q');
const run = document.getElementById('run');
const out = document.getElementById('out');
const cite = document.getElementById('cite');
const langSel = document.getElementById('lang');
const whoEl = document.getElementById('who');
const logoutBtn = document.getElementById('logout');

async function checkWhoami() {
  try {
    const res = await fetch(API_WHOAMI, { credentials: 'same-origin' });
    if (!res.ok) {
      // not authenticated -> go to login
      window.location = "/login";
      return;
    }
    const d = await res.json();
    // Prefer name, then email, then user_id
    let label = "";
    if (d.name && d.name.trim()) {
      label = `${d.name.trim()}`;
      if (d.email) label += ` (${d.email})`;
    } else if (d.email && d.email.trim()) {
      label = d.email;
    } else if (d.user_id) {
      label = d.user_id;
    } else {
      label = "Anonymous";
    }
    whoEl.textContent = `User: ${label}`;
  } catch (e) {
    console.error("whoami error", e);
    window.location = "/login";
  }
}

logoutBtn.onclick = async () => {
  try {
    await fetch(API_LOGOUT, { method: "POST", credentials: 'same-origin' });
  } catch (e) {
    console.warn("logout error", e);
  } finally {
    window.location = "/login";
  }
};

run.onclick = async () => {
  const text = q.value.trim();
  if (!text) return;
  run.disabled = true; out.textContent = "Thinking…"; cite.innerHTML = "";

  try {
    const res = await fetch(API_CHAT, {
      method: "POST",
      credentials: 'same-origin',            // ensure cookies are sent
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ text, lang: langSel.value || null })
    });

    if (!res.ok) {
      const err = await res.text();
      out.textContent = "Error " + res.status + ": " + err;
      return;
    }

    const data = await res.json();
    out.textContent = data.answer || "(no answer)";

    if (data.citations && data.citations.length) {
      const items = data.citations.map(c => {
        const url = c.meta && c.meta.url ? c.meta.url : (c.meta && c.meta.source_path ? c.meta.source_path : "");
        const label = c.title || url || "Source";
        return `<li>[${c.n}] ${label}${url ? ` — <code>${url}</code>` : ""}</li>`;
      }).join("");
      cite.innerHTML = `<strong>Sources</strong><ul>${items}</ul>`;
    } else {
      cite.innerHTML = "";
    }

  } catch (e) {
    out.textContent = "Error: " + e;
  } finally {
    run.disabled = false;
  }
};

// when page loads, verify auth and show user
checkWhoami();
</script>

</body>
</html>
